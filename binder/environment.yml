name: hsf-india
channels:
  - nvidia/label/cuda-13.2
  - conda-forge
dependencies:
  - python=3.14
  - aiohttp
  - astunparse
  - awkward
  - bash_kernel
  - bitsandbytes
  # clang-tools and numba/llvmlite both depend on LLVM. Without a version pin,
  # conda installs two separate libLLVM copies (~200MB each). Pin clang-tools to
  # the same major version that llvmlite requires so they share one libLLVM.
  # To find the current llvmlite LLVM version: micromamba list | grep llvm
  - clang-tools=21  # must match llvmlite's LLVM major version (llvmlite 0.50 → LLVM 21)
  - libclang13=21   # clang-tools depends on libclang13; pin to LLVM 21 build or solver picks LLVM 23 → second libLLVM copy
  - cxx-compiler
  - dask
  - datasets
  - distributed
  - graphviz
  - grpcio
  - hdf5
  - hepunits
  - hist
  - ipympl
  - code-server
  - jupyter-vscode-proxy
  - jupyterlab-deck
  - jupyterlab-mathjax3
  - lz4
  - matplotlib-base  # not matplotlib: the meta-package pulls pyside6 (Qt backend) → libllvm23; ipympl covers interactive use
  - cuda-nvcc
  - numba
  #- numpy<2  # pinned in ml branch; commented out for broader compatibility
  - openssh
  - pandas
  - particle
  - peft
  - pint
  - pip
  - polars
  - pyarrow
  - pybind11
  - pyhf
  - pympler
  - pyshp
  - py-spy
  - pytorch-gpu
  - python-graphviz
  - requests
  - scikit-learn
  - scipy
  - torch-geometric
  - torchvision
  - transformers
  - trl
  - uproot
  - vector
  - vim
  - pip:
      - h5py
      - tensorboard
      - jax[cuda13]
      - nvidia-cudnn-cu13
      - optax
      - equinox
      - flax
      - xgboost
      - omnilearned
      - servicex

variables:
  LD_LIBRARY_PATH: "'$LD_LIBRARY_PATH:$CONDA_PREFIX/lib/'"
