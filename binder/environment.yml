name: hsf-india
channels:
  - nvidia/label/cuda-13.4
  - conda-forge
dependencies:
  - python=3.12
  - aiohttp
  - astunparse
  - awkward
  - bash_kernel
  - bitsandbytes
  - clang-tools
  - cxx-compiler
  - dask
  - dask-awkward
  - datasets
  - distributed
  - graphviz
  - grpcio
  - hdf5
  - hepunits
  - hist
  - ipympl
  - jupyterlab-deck
  - jupyterlab-mathjax3
  - lz4
  - matplotlib
  - numba
  #- numpy<2  # pinned in ml branch; commented out for broader compatibility
  - openssh
  - pandas
  - particle
  - peft
  - pint
  - pip
  - polars
  - pyarrow
  - pybind11
  - pyhf
  - pympler
  - pyshp
  - py-spy
  - pytorch
  - python-graphviz
  - requests
  - scikit-learn
  - scipy
  - servicex
  - torch-geometric
  - torchvision
  - transformers
  - trl
  - uproot
  - vector
  - vim
  - pip:
      - h5py
      - tensorboard
      - jax[cuda13]
      - nvidia-cudnn-cu13
      - optax
      - equinox
      - flax
      - xgboost
      - omnilearned

variables:
  LD_LIBRARY_PATH: "'$LD_LIBRARY_PATH:$CONDA_PREFIX/lib/'"
