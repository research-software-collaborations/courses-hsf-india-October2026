name: Validate binder environment

on:
  push:
    branches: [binder, dev]
    paths:
      - binder/pixi.toml
      - binder/pixi.lock
      - .github/workflows/validate-binder.yml
  pull_request:
    branches: [binder, dev]
    paths:
      - binder/pixi.toml
      - binder/pixi.lock
      - .github/workflows/validate-binder.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # Match the Pixi version used to generate binder/pixi.lock
          pixi-version: v0.83.0
          manifest-path: binder/pixi.toml
          # Only the lock file is checked, so don't install the (large, GPU) environment
          run-install: false

      # Fails if pixi.lock is out of date with pixi.toml (including the PyPI
      # dependencies), without installing anything. The lock file declares CUDA on
      # its platform, so no CONDA_OVERRIDE_CUDA is needed on a runner without a GPU.
      - name: Check that pixi.lock is up to date with pixi.toml
        working-directory: binder
        run: pixi lock --check
